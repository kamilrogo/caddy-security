name: Build Caddy + caddy-security (alpine)

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC (just checks)
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Detect latest Caddy & caddy-security versions
        id: detect
        run: |
          # Detect Caddy version
          CADDY=$(docker run --rm caddy:alpine caddy version | head -n1 | awk '{print $1}')
          CADDY=${CADDY#v}
          echo "latest_caddy=$CADDY" >> $GITHUB_OUTPUT
          echo "Detected Caddy version: $CADDY"

          # Detect caddy-security version
          echo 'module dummy' > go.mod
          PLUGIN=$(go list -m -f '{{.Version}}' github.com/greenpau/caddy-security@latest)
          PLUGIN=${PLUGIN#v}
          echo "plugin_version=$PLUGIN" >> $GITHUB_OUTPUT
          echo "Detected caddy-security version: $PLUGIN"

          # Full combined tag
          FULL="${CADDY}-alpine-sec-${PLUGIN}"
          echo "full_tag=$FULL" >> $GITHUB_OUTPUT
          echo "Combined tag: $FULL"

      - name: Check existing image version
        id: check
        run: |
          IMAGE_BASE=ghcr.io/${{ github.repository_owner }}/caddy-security
          FULL_TAG=${{ steps.detect.outputs.full_tag }}

          echo "Checking if ${IMAGE_BASE}:${FULL_TAG} already exists..."

          docker pull ${IMAGE_BASE}:${FULL_TAG} 2>/dev/null || true

          EXISTS=$(docker images -q ${IMAGE_BASE}:${FULL_TAG} || true)

          if [ -n "$EXISTS" ]; then
            echo "already_built=true" >> $GITHUB_OUTPUT
            echo "Image already exists. Skipping."
          else
            echo "already_built=false" >> $GITHUB_OUTPUT
            echo "New build needed."
          fi

      - name: Stop if nothing to build
        if: steps.check.outputs.already_built == 'true'
        run: exit 0

      - name: Build image
        run: |
          IMAGE_BASE=ghcr.io/${{ github.repository_owner }}/caddy-security
          FULL_TAG=${{ steps.detect.outputs.full_tag }}

          echo "Building image for:"
          echo "  latest"
          echo "  ${FULL_TAG}"

          docker build --platform linux/amd64 \
            -t ${IMAGE_BASE}:latest \
            -t ${IMAGE_BASE}:${FULL_TAG} \
            .

      - name: Push image
        run: |
          IMAGE_BASE=ghcr.io/${{ github.repository_owner }}/caddy-security
          FULL_TAG=${{ steps.detect.outputs.full_tag }}

          echo "Pushing:"
          echo "  ${IMAGE_BASE}:latest"
          echo "  ${IMAGE_BASE}:${FULL_TAG}"

          docker push ${IMAGE_BASE}:latest
          docker push ${IMAGE_BASE}:${FULL_TAG}
