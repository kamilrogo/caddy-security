name: Build Caddy + caddy-security (alpine)

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect latest versions
        id: detect
        run: |
          CADDY=$(curl -s "https://registry.hub.docker.com/v2/repositories/library/caddy/tags?page_size=100&name=-alpine" | jq -r '.results[].name' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-alpine$' | sort -V | tail -1 | sed 's/-alpine$//')
          CADDY=${CADDY#v}
          echo "latest_caddy=$CADDY" >> $GITHUB_OUTPUT
      
          PLUGIN=$(curl -s "https://api.github.com/repos/greenpau/caddy-security/releases/latest" | jq -r '.tag_name' | sed 's/^v//')
          echo "plugin_version=$PLUGIN" >> $GITHUB_OUTPUT
      
          FULL="${CADDY}-alpine-sec-${PLUGIN}"
          echo "full_tag=$FULL" >> $GITHUB_OUTPUT
          echo "Combined tag: $FULL"

      - name: Check existing image
        id: check
        run: |
          IMAGE_BASE=ghcr.io/${{ github.repository_owner }}/caddy-security
          FULL_TAG=${{ steps.detect.outputs.full_tag }}
      
          if docker manifest inspect ${IMAGE_BASE}:${FULL_TAG} > /dev/null 2>&1; then
            echo "already_built=true" >> $GITHUB_OUTPUT
            echo "Image exists. Skipping."
          else
            echo "already_built=false" >> $GITHUB_OUTPUT
            echo "Building new image."
          fi

      - name: Build and push
        if: steps.check.outputs.already_built == 'false'
        uses: docker/build-push-action@v5
        timeout-minutes: 30
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/caddy-security:latest
            ghcr.io/${{ github.repository_owner }}/caddy-security:${{ steps.detect.outputs.full_tag }}
      
      - name: Create Release
        if: steps.check.outputs.already_built == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.detect.outputs.full_tag }}
          name: "Release ${{ steps.detect.outputs.full_tag }}"
          body: |
            ## Caddy v${{ steps.detect.outputs.latest_caddy }} with caddy-security v${{ steps.detect.outputs.plugin_version }}
            
            **Platforms:** ${{ steps.detect.outputs.platforms }}
      
            See the [project README](https://github.com/${{ github.repository }}/blob/main/README.md) for usage instructions.
          draft: false
          prerelease: false
