name: Caddy + Security Plugin Builder

on:
  schedule:
    - cron: "0 12 * * *"  # Daily at 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  check-versions:
    name: Check for new versions
    runs-on: ubuntu-latest
    outputs:
      caddy_version: ${{ steps.detect.outputs.latest_caddy }}
      plugin_version: ${{ steps.detect.outputs.plugin_version }}
      full_tag: ${{ steps.detect.outputs.full_tag }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Detect latest versions
        id: detect
        run: |
          CADDY=$(curl -s "https://registry.hub.docker.com/v2/repositories/library/caddy/tags?page_size=100&name=-alpine" | jq -r '.results[].name' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-alpine$' | sort -V | tail -1 | sed 's/-alpine$//')
          CADDY=${CADDY#v}
          echo "latest_caddy=$CADDY" >> $GITHUB_OUTPUT
          
          PLUGIN=$(curl -s "https://api.github.com/repos/greenpau/caddy-security/releases/latest" | jq -r '.tag_name' | sed 's/^v//')
          echo "plugin_version=$PLUGIN" >> $GITHUB_OUTPUT
          
          FULL="${CADDY}-alpine-sec-${PLUGIN}"
          echo "full_tag=$FULL" >> $GITHUB_OUTPUT
          echo "Combined tag: $FULL"
  
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
  
      - name: Check if build needed
        id: check
        run: |
          IMAGE_BASE=ghcr.io/${{ github.repository_owner }}/caddy-security
          FULL_TAG=${{ steps.detect.outputs.full_tag }}
          
          if docker manifest inspect ${IMAGE_BASE}:${FULL_TAG} > /dev/null 2>&1; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "Image exists. Skipping build."
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "New build needed."
          fi

  build-and-push:
    name: Build multi-arch image
    needs: check-versions
    if: needs.check-versions.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        timeout-minutes: 30
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/caddy-security:latest
            ghcr.io/${{ github.repository_owner }}/caddy-security:${{ needs.check-versions.outputs.full_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub release
    needs: [check-versions, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.check-versions.outputs.full_tag }}
          name: "Caddy ${{ needs.check-versions.outputs.caddy_version }} + Security ${{ needs.check-versions.outputs.plugin_version }}"
          body: |
            ## 🔐 Caddy v${{ needs.check-versions.outputs.caddy_version }} with caddy-security v${{ needs.check-versions.outputs.plugin_version }}
            
            **Supported Platforms:** `linux/amd64`, `linux/arm64`
            
            ### Usage
            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/caddy-security:${{ needs.check-versions.outputs.full_tag }}
            ```
            
            See the [README](https://github.com/${{ github.repository }}) for configuration details.
          draft: false
          prerelease: false
